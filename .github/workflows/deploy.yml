name: Deploy

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, xml, ctype, fileinfo, pdo, pdo_sqlite
          coverage: none

      - name: Install production dependencies
        run: composer install --no-dev --no-interaction --prefer-dist --optimize-autoloader

      - name: Verify production dependencies
        run: composer check-platform-reqs --no-dev

      - name: Prepare production artifact
        run: |
          rm -rf build
          mkdir -p build

          rsync -a \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='.env' \
            --exclude='tests/' \
            --exclude='docker/' \
            --exclude='docker-compose.yml' \
            --exclude='.phpunit.result.cache' \
            --exclude='build/' \
            ./ build/

          mkdir -p build/storage/framework/cache
          mkdir -p build/storage/framework/sessions
          mkdir -p build/storage/framework/views
          mkdir -p build/storage/logs

      - name: Deploy to cPanel via FTPS (dry run)
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          port: 21
          local-dir: ./build/
          server-dir: ./
          dry-run: true
          dangerous-clean-slate: false
          exclude: |
            **/.env
            **/storage/**
            **/.git*
            **/.git*/**
            **/.github/**
            **/tests/**
            **/docker/**
            **/docker-compose.yml
            **/.phpunit.result.cache
            **/build/**
            **/node_modules/**
